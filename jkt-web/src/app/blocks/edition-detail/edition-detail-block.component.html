<section class="my-12 px-4">
  <div
    class="max-w-6xl mx-auto"
    [style.--brand-primary]="data().edition.theme_accent"
    [style.--brand-primary-glow]="glow(data().edition.theme_accent)"
  >
    <div class="glass-tier2 p-8 md:p-12 border border-white/10">
      <div class="flex flex-col lg:flex-row gap-10 items-center justify-between">
        <div class="flex-1 w-full lg:w-auto text-center lg:text-left">
          <div class="inline-flex items-center px-6 py-3 glass-tier3 border border-white/15">
            <span class="font-mono text-xs text-chalk/90">
              {{ data().edition.name | tr }}
            </span>
          </div>

          <h2 class="mt-6 font-display text-chalk text-4xl md:text-5xl font-bold tracking-tight">
            {{ data().edition.name | tr }}
          </h2>

          @if (data().edition.venue) {
            <p class="mt-3 text-mist">{{ data().edition.venue | tr }}</p>
          }

          <p class="mt-2 text-mist">Tanggal: {{ formatDate(data().edition.race_date) }}</p>

          <div class="mt-8 glass-tier1 p-6 border border-white/10">
            <div class="text-mist text-sm">Harga pendaftaran</div>
            <div class="mt-2 font-display text-chalk text-3xl font-semibold">
              Rp {{ formatPrice(primaryPhase().price) }}
            </div>

            <div class="mt-5">
              <button
                type="button"
                class="btn-cta font-semibold"
                (click)="openRegister(primaryPhase().registration_url)"
              >
                Daftar
              </button>
            </div>
          </div>
        </div>

        <div class="flex-1 w-full flex justify-center lg:justify-end">
          <div class="glass-tier3 p-6">
            <div
              class="medal-glass"
              (mousemove)="onMedalMove($event)"
              (mouseleave)="onMedalLeave($event)"
              role="img"
              aria-label="Kartu medali kaca"
            >
              <img
                [ngSrc]="medalSrc()"
                width="512"
                height="512"
                class="w-full h-full object-contain"
                alt=""
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-external-link-dialog
    [visible]="dialogVisible"
    [pendingUrl]="pendingUrl"
    (visibleChange)="dialogVisible = $event"
  ></app-external-link-dialog>
</section>
