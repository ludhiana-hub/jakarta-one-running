<section class="my-12 px-4 sm:px-6 md:px-8">
  <div class="mx-auto max-w-[1400px]">
    <div class="glass-tier-1 rounded border border-glass-border p-6 sm:p-8">
      <h2 class="font-display text-2xl font-semibold text-chalk sm:text-3xl">
        2026 – 2030 Legacy
      </h2>
      <p class="mt-2 max-w-2xl font-body text-sm text-chalk/80 sm:text-base">
        Five years of movement, from Let’s Move Jakarta to Beyond Jakarta.
      </p>

      <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-5">
        @for (item of data().items; track item.id) {
          <div class="glass-tier-2 rounded border border-glass-border p-5 sm:p-6">
            <div class="font-label text-sm font-semibold tracking-[0.08em] text-primary">
              {{ item.year }}
            </div>
            <div class="mt-2 font-display text-lg font-semibold text-chalk sm:text-xl">
              {{ item.title | tr }}
            </div>
            <div class="mt-3 font-body text-sm leading-relaxed text-mist">
              {{ item.description | tr }}
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
