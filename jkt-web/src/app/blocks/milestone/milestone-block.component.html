<section class="my-12 px-4">
  <div class="max-w-6xl mx-auto">
    <div class="glass-tier1 p-7 border border-glass-border">
      <div class="font-display text-chalk text-2xl font-semibold">Roadmap</div>

      <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
        @for (item of data().items; track item.id) {
          <div class="glass-tier2 p-6 rounded-[22px] border border-glass-border">
            <div class="font-mono text-mist text-sm">{{ item.year }}</div>
            <div class="mt-2 font-display text-chalk text-xl font-semibold">
              {{ item.title | tr }}
            </div>
            <div class="mt-3 text-mist leading-relaxed">
              {{ item.description | tr }}
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
