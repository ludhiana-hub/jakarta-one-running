<section class="my-12 px-4 sm:px-6 md:px-8">
  <div class="mx-auto max-w-6xl">
    @if (data().heading) {
      <h2 class="mb-8 font-display text-3xl font-bold text-chalk sm:text-4xl">
        {{ data().heading | tr }}
      </h2>
    }

    <ol class="relative space-y-6 border-l border-glass-border pl-6">
      @for (item of data().items; track item.id) {
        <li class="relative">
          <span
            class="absolute -left-[1.625rem] top-1.5 h-3 w-3 rounded-full bg-chalk/80"
            aria-hidden="true"
          ></span>
          <div class="glass-tier2 rounded border border-glass-border p-5">
            <div class="font-mono text-sm text-mist">{{ item.date_label | tr }}</div>
            <div class="mt-2 font-display text-xl font-semibold text-chalk">
              {{ item.title | tr }}
            </div>
            @if (item.description) {
              <p class="mt-2 font-body leading-relaxed text-mist">
                {{ item.description | tr }}
              </p>
            }
          </div>
        </li>
      }
    </ol>
  </div>
</section>
