<section class="my-10 px-4">
  <div class="max-w-6xl mx-auto">
    <div class="glass-tier1 p-7">
      <div class="font-display text-chalk text-2xl font-semibold">Seri Etape</div>

      <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
        @for (item of data().items; track item.id) {
          <div class="glass-tier2 p-6 rounded-[22px] border border-white/10">
            <div class="text-chalk font-display text-xl font-semibold">
              {{ item.title | tr }}
            </div>
            @if (item.subtitle) {
              <div class="mt-2 text-mist">{{ item.subtitle | tr }}</div>
            }
          </div>
        }
      </div>
    </div>
  </div>
</section>
