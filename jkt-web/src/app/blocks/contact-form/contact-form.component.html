<section class="my-12 px-4 pt-28" appReveal>
  <div class="max-w-6xl mx-auto glass-tier1 p-7 border border-glass-border">
    <div class="font-display text-chalk text-2xl font-semibold">Kontak</div>

    <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <label class="block">
          <span class="text-mist text-sm">Nama</span>
          <input
            type="text"
            formControlName="name"
            class="mt-2 w-full px-4 py-3 rounded bg-void border border-glass-border text-chalk outline-none focus:border-ember"
            autocomplete="name"
          />
          @if (ctrl('name').touched && ctrl('name').invalid) {
            <div class="mt-1 text-ember text-sm">Nama wajib diisi.</div>
          }
        </label>

        <label class="block">
          <span class="text-mist text-sm">Email</span>
          <input
            type="email"
            formControlName="email"
            class="mt-2 w-full px-4 py-3 rounded bg-void border border-glass-border text-chalk outline-none focus:border-ember"
            autocomplete="email"
          />
          @if (ctrl('email').touched && ctrl('email').invalid) {
            <div class="mt-1 text-ember text-sm">Email tidak valid.</div>
          }
        </label>
      </div>

      <label class="block">
        <span class="text-mist text-sm">Pesan</span>
        <textarea
          formControlName="message"
          rows="5"
          class="mt-2 w-full px-4 py-3 rounded bg-void border border-glass-border text-chalk outline-none focus:border-ember"
        ></textarea>
        @if (ctrl('message').touched && ctrl('message').invalid) {
          <div class="mt-1 text-ember text-sm">Pesan wajib diisi.</div>
        }
      </label>

      @if (errorMsg) {
        <div class="text-ember text-sm">{{ errorMsg }}</div>
      }

      <div class="flex justify-end">
        <button
          type="submit"
          [disabled]="submitting"
          class="btn-cta font-semibold"
        >
          {{ submitting ? 'Mengirim...' : 'Kirim' }}
        </button>
      </div>

      @if (success) {
        <div class="mt-2 text-mist text-sm">
          Terima kasih. Pesan Anda sudah dikirim (stub /leads).
        </div>
      }
    </form>
  </div>
</section>
