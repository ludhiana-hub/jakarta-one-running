<section class="w-full">
  <div class="glass-tier1 rounded border border-glass-border p-5 sm:p-7">
    <div class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h2 class="font-display text-xl font-semibold text-chalk sm:text-2xl">Send a message</h2>
        <p class="mt-1 font-body text-sm text-on-surface-variant sm:text-base">
          Tell us what you need. We usually reply within 1–2 business days.
        </p>
      </div>
    </div>

    <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <label class="block">
          <span class="font-label text-sm font-medium text-mist">Name</span>
          <input
            type="text"
            formControlName="name"
            class="mt-2 w-full rounded border border-glass-border bg-surface px-4 py-3 font-body text-chalk outline-none transition focus:border-primary"
            autocomplete="name"
            placeholder="Your full name"
          />
          @if (ctrl('name').touched && ctrl('name').invalid) {
            <div class="mt-1 font-body text-sm text-ember">Name is required.</div>
          }
        </label>

        <label class="block">
          <span class="font-label text-sm font-medium text-mist">Email</span>
          <input
            type="email"
            formControlName="email"
            class="mt-2 w-full rounded border border-glass-border bg-surface px-4 py-3 font-body text-chalk outline-none transition focus:border-primary"
            autocomplete="email"
            placeholder="you@email.com"
          />
          @if (ctrl('email').touched && ctrl('email').invalid) {
            <div class="mt-1 font-body text-sm text-ember">Enter a valid email.</div>
          }
        </label>
      </div>

      <label class="block">
        <span class="font-label text-sm font-medium text-mist">Message</span>
        <textarea
          formControlName="message"
          rows="5"
          class="mt-2 w-full rounded border border-glass-border bg-surface px-4 py-3 font-body text-chalk outline-none transition focus:border-primary"
          placeholder="Partnership, media request, race day question..."
        ></textarea>
        @if (ctrl('message').touched && ctrl('message').invalid) {
          <div class="mt-1 font-body text-sm text-ember">Message must be at least 10 characters.</div>
        }
      </label>

      @if (errorMsg) {
        <div class="font-body text-sm text-ember">{{ errorMsg }}</div>
      }

      <div class="flex justify-end">
        <button type="submit" [disabled]="submitting" class="btn-cta font-semibold">
          {{ submitting ? 'Sending...' : 'Send message' }}
        </button>
      </div>

      @if (success) {
        <div class="mt-2 font-body text-sm text-mist">
          Thank you. Your message has been sent.
        </div>
      }
    </form>
  </div>
</section>
