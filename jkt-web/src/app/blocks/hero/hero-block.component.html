<section class="hero-block relative flex min-h-[100svh] items-center overflow-x-hidden bg-transparent pt-20 pb-12 sm:pt-24 sm:pb-16 md:pb-20">
  @if (data().bg_image; as bg) {
    <div class="hero-media pointer-events-none absolute inset-0 z-0" aria-hidden="true">
      <img
        [ngSrc]="bg"
        fill
        priority
        sizes="100vw"
        class="object-cover object-[70%_center] sm:object-[60%_center] md:object-center"
        alt=""
      />
      <!-- Soft fade into page bottom only — keep left white zone clean for copy -->
      <div class="absolute inset-0 bg-gradient-to-t from-white via-white/20 to-transparent"></div>
      <div class="absolute inset-y-0 left-0 w-[55%] bg-gradient-to-r from-white via-white/70 to-transparent sm:w-[42%]"></div>
    </div>
  }

  <div
    class="relative z-10 mx-auto grid w-full max-w-[1400px] grid-cols-1 items-center gap-8 px-4 py-10 sm:gap-10 sm:px-6 sm:py-16 md:px-8 lg:grid-cols-12"
  >
    <div class="space-y-5 sm:space-y-6 lg:col-span-7">
      @if (data().badge) {
        <div
          class="inline-flex max-w-full items-center gap-2 rounded border border-black/10 bg-white/80 px-3 py-1.5 shadow-sm backdrop-blur-sm sm:px-4"
        >
          <span class="h-2 w-2 shrink-0 animate-pulse rounded-full bg-west-red"></span>
          <span
            class="truncate font-label text-xs font-semibold uppercase tracking-[0.12em] text-chalk/80 sm:text-sm"
            >{{
            data().badge | tr
          }}</span>
        </div>
      }

      <h1 class="font-display text-3xl font-bold leading-[1.1] text-chalk sm:text-4xl md:text-6xl lg:text-[60px]">
        ONE CITY,<br />
        <span class="text-primary">ONE CELEBRATION</span>
      </h1>

      @if (data().tagline) {
        <p class="max-w-xl font-body text-base text-chalk/75 sm:text-lg md:text-xl">
          {{ data().tagline | tr }}
        </p>
      }

      <div class="flex flex-col gap-3 pt-2 sm:flex-row sm:flex-wrap sm:gap-4 sm:pt-4">
        @if (isInternalUrl(data().cta_url)) {
          <a
            [routerLink]="data().cta_url"
            class="btn-cta btn-cta-lg w-full justify-center font-display sm:w-auto"
          >
            {{ data().cta_label | tr }}
          </a>
        } @else {
          <a
            [href]="data().cta_url"
            target="_blank"
            rel="noopener"
            class="btn-cta btn-cta-lg w-full justify-center font-display sm:w-auto"
          >
            {{ data().cta_label | tr }}
          </a>
        }
        <a
          routerLink="/schedule"
          class="w-full rounded border border-chalk/15 bg-white/70 px-6 py-3.5 text-center font-display text-base font-bold text-chalk backdrop-blur-sm transition hover:bg-white sm:w-auto sm:px-8 sm:py-4 sm:text-lg"
        >
          View Routes
        </a>
      </div>
    </div>
