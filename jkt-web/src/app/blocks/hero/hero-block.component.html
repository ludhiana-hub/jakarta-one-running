<section class="hero-block relative flex min-h-[100svh] items-center overflow-x-hidden bg-transparent pt-20 pb-12 sm:pt-24 sm:pb-16 md:pb-20">
  @if (data().bg_image; as bg) {
    <div class="hero-media pointer-events-none absolute inset-0 z-0" aria-hidden="true">
      <img [ngSrc]="bg" fill priority class="object-cover object-center" alt="" />
      <div class="absolute inset-0 bg-gradient-to-b from-void/55 via-void/25 to-transparent"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-transparent via-black/15 to-black/35"></div>
    </div>
  }

  <div
    class="relative z-10 mx-auto grid w-full max-w-[1400px] grid-cols-1 items-center gap-8 px-4 py-10 sm:gap-10 sm:px-6 sm:py-16 md:px-8 lg:grid-cols-12"
  >
    <div class="space-y-5 sm:space-y-6 lg:col-span-7">
      @if (data().badge) {
        <div
          class="glass-tier-1 inline-flex max-w-full items-center gap-2 rounded-full border border-glass-border px-3 py-1.5 sm:px-4"
        >
          <span class="h-2 w-2 shrink-0 animate-pulse rounded-full bg-west-red"></span>
          <span class="truncate font-mono text-[10px] uppercase tracking-widest text-chalk sm:text-xs">{{
            data().badge | tr
          }}</span>
        </div>
      }

      <h1 class="font-display text-3xl font-bold leading-[1.1] text-chalk sm:text-4xl md:text-6xl lg:text-[60px]">
        ONE CITY,<br />
        <span class="text-primary">ONE CELEBRATION</span>
      </h1>

      @if (data().tagline) {
        <p class="max-w-xl font-body text-base text-chalk/90 sm:text-lg md:text-xl">
          {{ data().tagline | tr }}
        </p>
      }

      <div class="flex flex-col gap-3 pt-2 sm:flex-row sm:flex-wrap sm:gap-4 sm:pt-4">
        @if (isInternalUrl(data().cta_url)) {
          <a
            [routerLink]="data().cta_url"
            class="btn-cta btn-cta-lg w-full justify-center font-display sm:w-auto"
          >
            {{ data().cta_label | tr }}
          </a>
        } @else {
          <a
            [href]="data().cta_url"
            target="_blank"
            rel="noopener"
            class="btn-cta btn-cta-lg w-full justify-center font-display sm:w-auto"
          >
            {{ data().cta_label | tr }}
          </a>
        }
        <a
          routerLink="/schedule"
          class="glass-tier-1 w-full rounded-lg border border-glass-border px-6 py-3.5 text-center font-display text-base font-bold text-chalk transition hover:bg-white/10 sm:w-auto sm:px-8 sm:py-4 sm:text-lg"
        >
          View Routes
        </a>
      </div>
    </div>
