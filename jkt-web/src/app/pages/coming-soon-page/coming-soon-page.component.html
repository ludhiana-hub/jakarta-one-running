<div class="relative overflow-x-hidden">
  <div
    class="mx-auto flex min-h-[60vh] max-w-3xl flex-col items-center justify-center px-4 py-24 text-center sm:px-6 sm:py-32 md:px-8"
  >
    <div
      class="glass-tier-1 mb-6 inline-flex items-center gap-2 rounded px-3 py-1.5 font-label text-xs font-semibold uppercase tracking-[0.12em] text-primary sm:mb-8 sm:px-4"
    >
      {{ eyebrow }}
    </div>
    <h1 class="mb-4 font-display text-4xl tracking-tighter text-chalk sm:mb-6 sm:text-5xl md:text-6xl">
      {{ title }}
    </h1>
    <p class="max-w-xl font-body text-base text-on-surface-variant sm:text-lg">
      {{ message }}
    </p>
  </div>
</div>
