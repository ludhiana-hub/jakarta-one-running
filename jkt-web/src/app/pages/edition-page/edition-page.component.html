<div class="w-full pb-8">
  @if (editionCardsData$ | async; as cards) {
    <div appReveal>
      <app-block-edition-cards [data]="cards" />
    </div>
  }

  @if (seriesTimelineData$ | async; as timeline) {
    <div appReveal>
      <app-block-series-timeline [data]="timeline" />
    </div>
  }

  @if (editionDetailData$ | async; as detail) {
    <div appReveal>
      <app-block-edition-detail [data]="detail" />
    </div>
  }
</div>
