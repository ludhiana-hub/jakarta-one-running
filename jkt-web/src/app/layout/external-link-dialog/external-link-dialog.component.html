@if (visible) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true">
    <div class="absolute inset-0 bg-black/60" (click)="cancel()"></div>

    <div class="relative glass-tier3 w-full max-w-lg p-6">
      <h2 class="font-display text-chalk text-xl font-semibold">Anda akan meninggalkan situs ini</h2>
      <p class="mt-3 text-mist">
        Link registrasi mengarah ke platform eksternal. Kami akan membuka URL tersebut di tab baru.
      </p>

      <div class="mt-6 flex gap-3 justify-end">
        <button type="button" class="px-4 py-2 rounded-2xl border border-white/20 text-chalk/90 hover:text-chalk" (click)="cancel()">
          Batal
        </button>
        <button
          type="button"
          class="btn-cta font-semibold"
          (click)="confirm()"
        >
          Lanjutkan
        </button>
      </div>
    </div>
  </div>
}
