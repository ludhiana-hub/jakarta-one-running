<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>503 – Layanan Tidak Tersedia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#e6e8ee">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
      background:#e6e8ee;color:#1c1f26;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    main{max-width:480px;text-align:center}
    .code{font-size:clamp(72px,18vw,120px);font-weight:800;line-height:1;letter-spacing:-.04em;color:#c0392b}
    h1{margin-top:16px;font-size:22px;font-weight:700}
    p{margin-top:12px;font-size:15px;line-height:1.6;color:#4a5060}
    @media (prefers-color-scheme:dark){
      body{background:#14161b;color:#eceef3}
      .code{color:#ff6b5b}
      p{color:#a3a9b8}
    }
  </style>
</head>
<body>
  <main>
    <div class="code">503</div>
    <h1>Layanan Tidak Tersedia</h1>
    <p>Server sedang mengalami gangguan atau dalam pemeliharaan. Silakan coba kembali beberapa saat lagi.</p>
    <p style="font-size:13px">Service Unavailable &middot; Please try again later.</p>
  </main>
</body>
</html>
