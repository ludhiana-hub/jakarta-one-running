# Local / nested compose (optional). Prefer root ./docker-compose.yml on Dokploy.

services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000"
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      NODE_ENV: production
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1,*.sslip.io,103.55.37.253,jakartaonerunningseries.com,*.jakartaonerunningseries.com"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
