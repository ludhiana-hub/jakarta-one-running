# Dokploy Compose (repo root)
# Compose Path: ./docker-compose.yml
#
# Domains UI: Service=landing, Container Port=4000
# Optional env override: TRAEFIK_HOST=<your-sslip-or-custom-domain>

services:
  landing:
    build:
      context: ./jkt-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000"
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      NODE_ENV: production
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.jor-landing.loadbalancer.server.port=4000
      # Default = current Dokploy sslip host (override with TRAEFIK_HOST if it changes)
      - traefik.http.routers.jor-landing-http.rule=Host(`${TRAEFIK_HOST:-jakartaonerunning-landing-page-tvrexw-c6f4a7-103-55-37-253.sslip.io}`)
      - traefik.http.routers.jor-landing-http.entrypoints=web
      - traefik.http.routers.jor-landing-http.service=jor-landing
      - traefik.http.routers.jor-landing-https.rule=Host(`${TRAEFIK_HOST:-jakartaonerunning-landing-page-tvrexw-c6f4a7-103-55-37-253.sslip.io}`)
      - traefik.http.routers.jor-landing-https.entrypoints=websecure
      - traefik.http.routers.jor-landing-https.tls=true
      - traefik.http.routers.jor-landing-https.service=jor-landing

networks:
  dokploy-network:
    external: true
