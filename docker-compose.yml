# Dokploy Compose — repo root
# Compose path in Dokploy: ./docker-compose.yml
# Domain → service `landing` / port 4000
# Docs: https://docs.dokploy.com/docs/core/docker-compose

services:
  landing:
    build:
      context: ./jkt-web
      dockerfile: Dockerfile
    restart: unless-stopped
    # Publish container port only (Dokploy / Traefik attaches domain)
    ports:
      - "4000"
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      NODE_ENV: production
    networks:
      - dokploy-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s

networks:
  dokploy-network:
    external: true
