# Dokploy Compose (repo root)
# Compose Path: ./docker-compose.yml
#
# Domains UI MUST use:
#   Service: landing
#   Container Port: 4000
# Then click Redeploy (labels are applied only at deploy time).
# Docs: https://docs.dokploy.com/docs/core/docker-compose/domains

services:
  landing:
    build:
      context: ./jkt-web
      dockerfile: Dockerfile
    restart: unless-stopped
    # Same pattern as Dokploy docs — publish container port for Traefik
    ports:
      - "4000"
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      NODE_ENV: production
    # Dokploy Domains UI injects traefik labels + network on deploy.
    # Keep dokploy-network so Traefik can reach this service.
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
